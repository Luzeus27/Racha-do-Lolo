<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Racha do Loló — testes das funções Mercado Pago</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; padding: 20px; background: #f6f8fb; color: #17202a; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.topo { margin: 0 0 16px; color: #5b6776; font-size: 13px; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; }
  button[disabled] { opacity: .6; cursor: default; }
  #summary { margin: 14px 0; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #dbe3ee; font-weight: 600; }
  #summary.ok { border-color: #86efac; background: #f0fdf4; color: #166534; }
  #summary.fail { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
  .grupo { margin: 18px 0 8px; font-weight: 700; font-size: 14px; color: #334155; }
  .teste { padding: 7px 10px; margin: 4px 0; border-radius: 8px; background: #fff; border: 1px solid #e5eaf1; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .teste.ok { border-left: 4px solid #22c55e; }
  .teste.fail { border-left: 4px solid #ef4444; background: #fff7f7; }
  .tag { font-size: 11px; font-weight: 700; min-width: 42px; }
  .ok .tag { color: #15803d; }
  .fail .tag { color: #b91c1c; }
  .detalhe { color: #b91c1c; font-size: 12px; white-space: pre-wrap; }
  code { background: #eef2f7; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Testes das funções Mercado Pago</h1>
<p class="topo">Roda localmente, sem deploy e sem chaves reais. Os dados ficam só nesta aba. Use também a checagem de fluxo de caixa em <code>index.html</code>.</p>
<button id="run" type="button">Rodar novamente</button>
<div id="summary">Preparando…</div>
<div id="report"></div>

<script>
(async function () {
/* ------------------------------------------------------------------ */
/* Infraestrutura de teste                                             */
/* ------------------------------------------------------------------ */

const origFetch = globalThis.fetch.bind(globalThis);
const origProcess = globalThis.process;
const KEY = 'RL-TESTE-00000001';
const DEVICE = 'DEV-AAAAAAAAAAAAAAAAAAAAAAAA';
const V = 'VW-0123456789ABCDEF';
const P = 'VP-0123456789ABCDEF';
const PLAYER = 'p1';
const GAME = 'jogo1';
const SECRET = 'SEGREDO-WEBHOOK-TESTE';

let counter = 0;
let mpHandler = null;
let mpCalls = [];
let stores = {};
let licenseMap = new Map();
let viewMap = new Map();
let rateMap = new Map();
let stateMap = new Map();
let attemptsMap = new Map();
let eventsMap = new Map();

/* HMAC determinístico e simples: serve para validar o fluxo da assinatura,
   não para substituir a criptografia real (que o Netlify usa no servidor). */
function stubHmac(secret, message) {
  const text = String(secret) + '|' + String(message);
  let out = '';
  for (let block = 0; block < 8; block++) {
    let h = (2166136261 ^ (block * 2654435761)) >>> 0;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i) + block;
      h = Math.imul(h, 16777619) >>> 0;
    }
    out += h.toString(16).padStart(8, '0');
  }
  return out;
}

globalThis.Buffer = {
  byteLength: (v) => new TextEncoder().encode(String(v ?? '')).length,
  from: (v) => {
    const s = String(v ?? '');
    return { toString: () => s, get length() { return s.length; } };
  }
};

const HASH_FAKE = 'a'.repeat(64);
const cryptoSource = `
  export function createHash() {
    return { update() { return this; }, digest() { return '${HASH_FAKE}'; } };
  }
  export function randomUUID() {
    counterGlobal += 1;
    const n = counterGlobal.toString(16).padStart(2, '0').repeat(16).slice(0, 32);
    return n.slice(0,8)+'-'+n.slice(8,12)+'-'+n.slice(12,16)+'-'+n.slice(16,20)+'-'+n.slice(20);
  }
  export function randomBytes(n) {
    counterGlobal += 1;
    let out = '';
    while (out.length < n * 2) out += counterGlobal.toString(16).padStart(2, '0');
    return { toString() { return out.slice(0, n * 2); } };
  }
  export function createHmac(alg, secret) {
    const parts = [];
    return { update(v) { parts.push(String(v)); return this; }, digest() { return globalThis.__stubHmac(secret, parts.join('')); } };
  }
  export function timingSafeEqual(a, b) { return String(a) === String(b); }
`;
globalThis.__stubHmac = stubHmac;
globalThis.counterGlobal = counter;
/* encodeURIComponent não escapa aspas simples; sem isto o specifier do import quebra. */
const dataUrl = (source) => 'data:text/javascript,' + encodeURIComponent(source).replace(/'/g, '%27');
const cryptoUrl = dataUrl(cryptoSource);

function makeMapStore(map) {
  return {
    get: async (k) => map.has(k) ? map.get(k) : null,
    setJSON: async (k, v, opts) => {
      if (opts && opts.onlyIfNew && map.has(k)) return { modified: false };
      map.set(k, v);
      return { modified: true };
    },
    delete: async (k) => { map.delete(k); },
    list: async () => ({ blobs: Array.from(map.keys()).map((key) => ({ key })) })
  };
}

let lockMap = new Map();

function installStores() {
  stores = {
    'racha-licencas': makeMapStore(licenseMap),
    'racha-visualizacoes': makeMapStore(viewMap),
    'racha-rate': makeMapStore(rateMap),
    'racha-tentativas': makeMapStore(attemptsMap),
    'racha-webhook-eventos': makeMapStore(eventsMap),
    'racha-cobrancas-lock': makeMapStore(lockMap)
  };
  globalThis.__stores = stores;
}
installStores();

const blobUrl = dataUrl(
  'export function getStore(o){ return globalThis.__stores[o.name] || { get:async()=>null, setJSON:async()=>{}, delete:async()=>{}, list:async()=>({blobs:[]}) }; }'
);

function reexportUrl(name, mod) {
  const body = Object.keys(mod).map((k) => `export const ${k} = globalThis.__mods.${name}.${k};`).join('\n');
  return dataUrl(body);
}

async function loadModule(file, replacements = []) {
  let src = await origFetch(new URL(file, location.href)).then((r) => {
    if (!r.ok) throw new Error('Não foi possível ler ' + file);
    return r.text();
  });
  for (const [from, to] of replacements) src = src.split(from).join(to);
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  try { return await import(url); } finally { URL.revokeObjectURL(url); }
}

globalThis.__mods = {};
globalThis.__etapa = 'shared';
const sharedReplacements = [
  ["from 'node:crypto'", "from '" + cryptoUrl + "'"],
  ["from '@netlify/blobs'", "from '" + blobUrl + "'"]
];
globalThis.__mods.shared = await loadModule('../netlify/functions/_shared.mjs', sharedReplacements);
globalThis.__etapa = 'daily';
globalThis.__mods.daily = await loadModule('../netlify/functions/_daily.mjs');
globalThis.__etapa = 'reexports';
const sharedUrl = reexportUrl('shared', globalThis.__mods.shared);
const dailyUrl = reexportUrl('daily', globalThis.__mods.daily);

const commonReplacements = [
  ...sharedReplacements,
  ["from './_shared.mjs'", "from '" + sharedUrl + "'"],
  ["from './_daily.mjs'", "from '" + dailyUrl + "'"]
];

const names = [
  'mp-connect', 'create-daily-pix', 'create-monthly-pix', 'create-monthly-card',
  'create-monthly-auto', 'cancel-monthly-auto', 'manage-daily-payments',
  'get-player-view', 'view-respond', 'view-rating', 'admin-confirm', 'mp-webhook',
  'find-player', 'create-master', 'send-reminders', 'reconcile-licenses',
  'change-plan', 'license'
];
for (const name of names) {
  globalThis.__etapa = 'modulo:' + name;
  globalThis.__mods[name] = await loadModule('../netlify/functions/' + name + '.mjs', commonReplacements);
}
globalThis.__etapa = 'fixtures';

/* ------------------------------------------------------------------ */
/* Fixtures                                                            */
/* ------------------------------------------------------------------ */

function connectedLicense(days = 90) {
  return {
    status: 'active',
    ownerKey: KEY,
    nextPaymentAt: new Date(Date.now() + 30 * 86400000).toISOString(),
    devices: [DEVICE],
    email: 'dono@exemplo.com',
    mpConnection: {
      accessToken: 'ACCESS_TOKEN_TESTE',
      refreshToken: 'REFRESH_TOKEN_TESTE',
      email: 'loja@exemplo.com',
      userId: '123456',
      expiresAt: new Date(Date.now() + days * 86400000).toISOString(),
      connectedAt: new Date().toISOString()
    }
  };
}

function baseView(overrides = {}) {
  const base = {
    ownerKey: KEY,
    paymentMode: 'mp',
    playerTokens: { [PLAYER]: P },
    playerRoles: { [PLAYER]: 'monthly' },
    responses: {},
    waitlist: {},
    reservations: {},
    dailyPayments: {},
    monthlyPayments: {},
    autoPayments: {},
    dailyCredits: {},
    paymentNotices: [],
    snapshot: {
      settings: {
        year: 2026, monthlyFee: 60, dayFee: 60, maxPlayers: 6,
        dailyPaymentEnabled: true,
        pixKey: 'rachadololo@gmail.com', pixMerchant: 'RACHA DO LOLO', pixCity: 'MACEIO - AL'
      },
      players: [{ id: PLAYER, name: 'Ana', type: 'mensalista' }],
      games: [{ id: GAME, date: '2026-12-10', done: false }],
      dues: { [PLAYER]: [{ month: 11, year: 2026, amount: 60, paid: false, pix: '', txid: 'RL202611P1' }] },
      finance: { paid: 0, open: 60 }
    }
  };
  const snap = overrides.snapshot || {};
  return {
    ...base,
    ...overrides,
    snapshot: {
      ...base.snapshot,
      ...snap,
      settings: { ...base.snapshot.settings, ...(snap.settings || {}) },
      dues: snap.dues || base.snapshot.dues
    }
  };
}

function defaultMpHandler(url, init) {
  const method = String(init?.method || 'GET').toUpperCase();
  const body = init?.body ? JSON.parse(init.body) : {};
  if (url.includes('/oauth/token')) {
    return {
      ok: true, status: 200,
      data: {
        access_token: 'NOVO_ACCESS_TOKEN_TESTE', refresh_token: 'NOVO_REFRESH_TOKEN_TESTE',
        expires_in: 15552000, user_id: '123456', user_email: 'loja@exemplo.com'
      }
    };
  }
  if (method === 'POST' && url.endsWith('/v1/payments')) {
    return {
      ok: true, status: 201,
      data: {
        id: 'MP-' + (++globalThis.counterGlobal),
        point_of_interaction: { transaction_data: { qr_code: '000201TESTE' + globalThis.counterGlobal, qr_code_base64: 'QUJD' } }
      }
    };
  }
  if (method === 'POST' && url.endsWith('/checkout/preferences')) {
    return { ok: true, status: 201, data: { id: 'PREF-1', init_point: 'https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=PREF-1' } };
  }
  if (method === 'POST' && url.endsWith('/preapproval')) {
    return { ok: true, status: 201, data: { id: 'PRE-1', init_point: 'https://www.mercadopago.com.br/authorization?preapproval_id=PRE-1' } };
  }
  if (url.includes('/refund') || (method === 'PUT' && url.includes('/preapproval/'))) {
    return { ok: true, status: 200, data: { id: 'REF-1' } };
  }
  return { ok: true, status: 200, data: {} };
}

function reset(options = {}) {
  globalThis.counterGlobal = ++counter;
  licenseMap = new Map();
  viewMap = new Map();
  rateMap = new Map();
  stateMap = new Map();
  attemptsMap = new Map();
  eventsMap = new Map();
  lockMap = new Map();
  installStores();

  const license = options.license === undefined ? connectedLicense(options.expiresInDays) : options.license;
  if (license) licenseMap.set(KEY, license);
  const view = options.view === undefined ? baseView() : options.view;
  if (view) viewMap.set(V, view);

  globalThis.process = {
    env: {
      SITE_URL: 'https://rachadololo.netlify.app',
      PLAYER_PAYMENTS: 'manual',
      MP_ACCESS_TOKEN: 'GLOBAL_TOKEN_TESTE',
      MP_WEBHOOK_SECRET: SECRET,
      MP_CLIENT_ID: 'CLIENT_ID_TESTE',
      MP_CLIENT_SECRET: 'CLIENT_SECRET_TESTE',
      MP_CARD_FEE: '0.0498',
      ...(options.env || {})
    }
  };

  mpCalls = [];
  mpHandler = options.mpHandler || defaultMpHandler;
  globalThis.fetch = async (input, init) => {
    const url = typeof input === 'string' ? input : (input && input.url) || String(input);
    if (url.startsWith('https://api.mercadopago.com')) {
      const headers = new Headers(init?.headers || {});
      mpCalls.push({ url, method: String(init?.method || 'GET').toUpperCase(), body: init?.body ? JSON.parse(init.body) : {}, auth: headers.get('authorization') || '' });
      const result = await mpHandler(url, init);
      if (result instanceof Response) return result;
      return new Response(JSON.stringify(result.data ?? {}), {
        status: result.status || 200,
        headers: { 'content-type': 'application/json' }
      });
    }
    return origFetch(input, init);
  };
}

function post(fn, body, headers = {}) {
  return fn(new Request('https://rachadololo.netlify.app/.netlify/functions/teste', {
    method: 'POST',
    headers: { 'content-type': 'application/json', ...headers },
    body: JSON.stringify(body)
  }));
}
function get(fn, query) {
  return fn(new Request('https://rachadololo.netlify.app/.netlify/functions/teste?' + query));
}

function webhookHeaders(dataId, requestId = 'req-1', secret = SECRET) {
  const ts = String(Date.now());
  const manifest = 'id:' + String(dataId).toLowerCase() + ';request-id:' + requestId + ';ts:' + ts + ';';
  return {
    'content-type': 'application/json',
    'x-request-id': requestId,
    'x-signature': 'ts=' + ts + ',v1=' + stubHmac(secret, manifest)
  };
}
function callWebhook(dataId, topic) {
  return globalThis.__mods['mp-webhook'].default(new Request(
    'https://rachadololo.netlify.app/.netlify/functions/mp-webhook?' + new URLSearchParams({
      cliente: KEY, topic, 'data.id': dataId
    }).toString(),
    { method: 'GET', headers: webhookHeaders(dataId, 'req-1', optionsSecret()) }
  ));
}
function optionsSecret() { return globalThis.process.env.MP_WEBHOOK_SECRET || SECRET; }

/* ------------------------------------------------------------------ */
/* Asserções e relatório                                              */
/* ------------------------------------------------------------------ */

const suites = [];
let atual = null;
function grupo(nome) { atual = { nome, testes: [] }; suites.push(atual); }
async function teste(nome, fn) {
  try { await fn(); atual.testes.push({ nome, ok: true }); }
  catch (e) { atual.testes.push({ nome, ok: false, erro: e && e.message ? e.message : String(e) }); }
}
function ok(cond, msg) { if (!cond) throw new Error(msg || 'Condição falsa'); }
function eq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error((msg || 'Valores diferentes') + ': esperado ' + sb + ', recebido ' + sa);
}
function perto(a, b, msg) { if (Math.abs(Number(a) - Number(b)) > 0.005) throw new Error((msg || 'Valores diferentes') + ': esperado ' + b + ', recebido ' + a); }
function includes(texto, parte, msg) { ok(String(texto).includes(String(parte)), (msg || 'Texto não encontrado') + ': ' + parte); }
function naiveClone(v) { return JSON.parse(JSON.stringify(v)); }

/* ------------------------------------------------------------------ */
/* Bateria de testes                                                   */
/* ------------------------------------------------------------------ */

const S = globalThis.__mods.shared;

grupo('1. Regras de taxa e modo de pagamento');
await teste('taxa padrão 4,98% aceita 0.0498 e 4.98', () => {
  reset();
  eq(S.cardFeeRate(), 0.0498);
  globalThis.process.env.MP_CARD_FEE = '4.98';
  eq(S.cardFeeRate(), 0.0498);
  globalThis.process.env.MP_CARD_FEE = '0';
  eq(S.cardFeeRate(), 0.0498);
});
await teste('valor do cartão é líquido/(1-taxa), arredondado para cima', () => {
  reset();
  eq(S.cardGross(60), 63.15);
  eq(S.cardGross(70), 73.67);
  const taxa = S.cardFeeRate();
  ok(S.cardGross(60) * (1 - taxa) >= 60 - 0.00001, 'o racha receberia menos que R$ 60');
});
await teste('modo MP publicado só vale com conta vinculada', async () => {
  reset({ license: null });
  eq(await S.paymentModeFor({ paymentMode: 'mp', ownerKey: KEY }), 'manual');
  reset();
  eq(await S.paymentModeFor({ paymentMode: 'mp', ownerKey: KEY }), 'mp');
});
await teste('variável global MP força o modo sem depender da publicação', async () => {
  reset({ env: { PLAYER_PAYMENTS: 'mp' }, license: null });
  eq(await S.paymentModeFor({ paymentMode: 'manual', ownerKey: KEY }), 'mp');
});
await teste('status do vínculo nunca devolve token, refresh ou segredo', () => {
  reset();
  const status = S.mpStatusFor(licenseMap.get(KEY));
  const texto = JSON.stringify(status);
  ok(status.connected && status.configured, 'status deveria estar conectado');
  eq(status.email, 'l***@exemplo.com');
  ok(!texto.includes('ACCESS_TOKEN_TESTE'), 'token vazou');
  ok(!texto.includes('REFRESH_TOKEN_TESTE'), 'refresh vazou');
  ok(!texto.includes('CLIENT_SECRET_TESTE'), 'secret vazou');
});
await teste('token renovado no servidor antes dos 7 dias', async () => {
  reset({ expiresInDays: 3 });
  const token = await S.mpTokenFor(KEY);
  eq(token, 'NOVO_ACCESS_TOKEN_TESTE');
  includes(mpCalls[0].body.grant_type, 'refresh_token');
  eq(licenseMap.get(KEY).mpConnection.refreshToken, 'NOVO_REFRESH_TOKEN_TESTE');
});

grupo('2. Vínculo Mercado Pago em um clique (OAuth)');
let stateValido = '';
await teste('start abre autorização correta sem expor segredo', async () => {
  reset();
  const res = await post(globalThis.__mods['mp-connect'].default, { action: 'start', licenseKey: KEY, deviceId: DEVICE });
  const data = await res.json();
  eq(res.status, 200);
  const url = new URL(data.authorizationUrl);
  eq(url.host, 'auth.mercadopago.com');
  eq(url.searchParams.get('client_id'), 'CLIENT_ID_TESTE');
  eq(url.searchParams.get('redirect_uri'), 'https://rachadololo.netlify.app/.netlify/functions/mp-connect');
  ok(/^[a-f0-9]{32}$/.test(url.searchParams.get('state') || ''), 'state inválido');
  ok(!JSON.stringify(data).includes('CLIENT_SECRET_TESTE'), 'segredo apareceu na resposta');
  stateValido = url.searchParams.get('state');
});
await teste('callback salva token/refresh só no Blob e volta para #config', async () => {
  const res = await get(globalThis.__mods['mp-connect'].default, 'code=codigo-teste&state=' + stateValido);
  eq(res.status, 302);
  eq(res.headers.get('location'), 'https://rachadololo.netlify.app/index.html#config&mp=connected');
  const conn = licenseMap.get(KEY).mpConnection;
  eq(conn.accessToken, 'NOVO_ACCESS_TOKEN_TESTE');
  eq(conn.refreshToken, 'NOVO_REFRESH_TOKEN_TESTE');
});
await teste('state é de uso único', async () => {
  const res = await get(globalThis.__mods['mp-connect'].default, 'code=codigo-teste&state=' + stateValido);
  eq(res.status, 302);
  includes(res.headers.get('location'), 'mp=error');
});
await teste('callback recusa aparelho diferente do autorizado', async () => {
  reset();
  const start = await post(globalThis.__mods['mp-connect'].default, { action: 'start', licenseKey: KEY, deviceId: DEVICE });
  const state = new URL((await start.json()).authorizationUrl).searchParams.get('state');
  licenseMap.get(KEY).devices = ['DEV-BBBBBBBBBBBBBBBBBBBBBBBB'];
  delete licenseMap.get(KEY).mpConnection;
  const res = await get(globalThis.__mods['mp-connect'].default, 'code=codigo-teste&state=' + state);
  includes(res.headers.get('location'), 'mp=error');
  ok(!licenseMap.get(KEY).mpConnection, 'vínculo não deveria ter sido salvo');
});

grupo('3. Diária no Mercado Pago');
const dailyCall = () => post(globalThis.__mods['create-daily-pix'].default, { v: V, p: P, gameId: GAME });
await teste('modo manual recusa criação de PIX no MP', async () => {
  reset({ view: baseView({ paymentMode: 'manual' }) });
  const res = await dailyCall();
  eq(res.status, 410);
});
await teste('PIX da diária usa token do dono e valor líquido', async () => {
  reset({ view: baseView({ playerRoles: { [PLAYER]: 'daily' }, snapshot: { players: [{ id: PLAYER, name: 'Ana', type: 'diarista' }] } }) });
  const res = await dailyCall();
  const data = await res.json();
  eq(res.status, 200);
  eq(data.status, 'pending');
  eq(mpCalls.length, 1);
  eq(mpCalls[0].auth, 'Bearer ACCESS_TOKEN_TESTE');
  eq(mpCalls[0].body.transaction_amount, 60);
  eq(mpCalls[0].body.payment_method_id, 'pix');
  eq(mpCalls[0].body.notification_url, 'https://rachadololo.netlify.app/.netlify/functions/mp-webhook');
  ok(data.payment.qrCode.startsWith('000201'), 'QR não devolvido');
});
await teste('segundo toque reaproveita o mesmo QR', async () => {
  await dailyCall();
  const antes = mpCalls.length;
  const res = await dailyCall();
  const data = await res.json();
  eq(data.status, 'pending');
  eq(mpCalls.length, antes);
});
await teste('sem vaga entra na fila sem chamar o Mercado Pago', async () => {
  reset({ view: baseView({
    playerRoles: { [PLAYER]: 'daily' },
    snapshot: { players: [{ id: PLAYER, name: 'Ana', type: 'diarista' }], settings: { maxPlayers: 1 } },
    responses: { [GAME]: { outro: 'yes' } }
  }) });
  const res = await dailyCall();
  const data = await res.json();
  eq(data.status, 'wait');
  ok(Array.isArray(data.waitlist) && data.waitlist.includes(PLAYER), 'jogador não entrou na fila');
  eq(mpCalls.length, 0);
});
await teste('crédito de jogo cancelado confirma sem novo pagamento', async () => {
  reset({ view: baseView({ playerRoles: { [PLAYER]: 'daily' }, dailyCredits: { [PLAYER]: 60 }, snapshot: { players: [{ id: PLAYER, name: 'Ana', type: 'diarista' }] } }) });
  const res = await dailyCall();
  const data = await res.json();
  eq(data.status, 'yes');
  eq(data.usedCredit, true);
  eq(mpCalls.length, 0);
  eq(viewMap.get(V).dailyCredits[PLAYER] || 0, 0);
});

grupo('4. Mensalidade: PIX, cartão e cobrança automática');
await teste('PIX da mensalidade cobra apenas o valor líquido', async () => {
  reset();
  const res = await post(globalThis.__mods['create-monthly-pix'].default, { v: V, p: P, month: 11, year: 2026 });
  const data = await res.json();
  eq(res.status, 200);
  eq(mpCalls[0].body.transaction_amount, 60);
  eq(data.payment.amount, 60);
  eq(data.payment.grossAmount || 0, 0);
});

grupo('8. Fluxo de caixa — a taxa não entra');
await teste('revenue() e publicSnapshot() usam só amount, não bruto/taxa', async () => {
  const src = await origFetch(new URL('../app.js', location.href)).then((r) => r.text());
  const inicio = src.indexOf('function revenue(m)');
  const fim = src.indexOf('function expenses(m)', inicio);
  const fn = src.slice(inicio, fim);
  ok(fn.includes('p.amount') && fn.includes('d.amount'), 'revenue não usa os valores esperados');
  ok(!/\b(gross|fee|grossAmount|feeAmount|cardGross|cardFee)\b/i.test(fn), 'taxa apareceu em revenue()');
  const ini2 = src.indexOf('function publicSnapshot()');
  const fim2 = src.indexOf('async function publishView', ini2);
  const snapFn = src.slice(ini2, fim2);
  ok(snapFn.includes('paid += amount'), 'financeiro público não soma amount');
  ok(!/\b(gross|fee|grossAmount|feeAmount|cardGross|cardFee)\b/i.test(snapFn), 'taxa apareceu em publicSnapshot()');
});
await teste('revenue() ignora bruto/taxa mesmo quando o registro contém esses campos', async () => {
  const src = await origFetch(new URL('../app.js', location.href)).then((r) => r.text());
  const ini = src.indexOf('function revenue(m)');
  const fim = src.indexOf('function expenses(m)', ini);
  ok(ini >= 0 && fim > ini, 'revenue() não encontrada');
  const num = (v) => { const n = Number(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
  const sum = (arr, fn) => arr.reduce((a, x) => a + num(fn(x)), 0);
  const state = {
    payments: [{ year: 2026, month: 11, amount: 60, grossAmount: 63.15, feeAmount: 3.15, paid: true }],
    dayEntries: [{ year: 2026, month: 11, amount: 60, grossAmount: 70, feeAmount: 10 }]
  };
  const revenue = new Function('state', 'year', 'num', 'sum', src.slice(ini, fim) + '; return revenue;')(state, () => 2026, num, sum);
  eq(revenue(11), { mens: 60, dias: 60, total: 120 });
});

grupo('9. Proteção contra taxa digitada ou importada');
await teste('cashNet transforma bruto digitado em líquido e preserva desconto', async () => {
  const src = await origFetch(new URL('../app.js', location.href)).then((r) => r.text());
  const match = src.match(/const cashNet = \(amount, expected\) => \{[\s\S]*?\n\};/);
  ok(match, 'cashNet não encontrada');
  const criar = new Function('num', 'return ' + match[0].replace(/^const cashNet = /, '').replace(/;$/, ''));
  const cashNet = criar((v) => { const n = Number(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; });
  eq(cashNet(63.15, 60), 60);
  eq(cashNet(55, 60), 55);
  eq(cashNet(60, 0), 60);
});

await teste('webhook repetido não processa o mesmo evento duas vezes', async () => {

await teste('upgrade Básico → PRO muda a assinatura atual, sem nova chave nem cobrança dupla', async () => {
  reset({
    license: {
      key: KEY, email: 'cliente@exemplo.com', plan: 'monthly', amount: 9.9,
      status: 'active', subscriptionId: 'PRE-1', devices: [DEVICE],
      nextPaymentAt: new Date(Date.now() + 20 * 86400000).toISOString(), history: []
    },
    mpHandler: (url, init) => {
      const method = String(init?.method || 'GET').toUpperCase();
      if (url.includes('/preapproval/PRE-1') && method === 'GET') {
        return { ok: true, status: 200, data: { id: 'PRE-1', status: 'authorized', auto_recurring: { transaction_amount: 9.9, currency_id: 'BRL' } } };
      }
      return defaultMpHandler(url, init);
    }
  });
  const res = await post(globalThis.__mods['change-plan'].default, { key: KEY, deviceId: DEVICE, plan: 'intermediate_monthly' });
  const data = await res.json();
  eq(res.status, 200, 'upgrade recusado');
  eq(data.ok, true, 'resposta sem ok');
  eq(data.plan, 'intermediate_monthly');
  eq(data.amount, 19.9);
  const saved = licenseMap.get(KEY);
  eq(saved.plan, 'intermediate_monthly', 'plano do Blobs não mudou');
  eq(saved.amount, 19.9, 'valor do Blobs não mudou');
  eq(saved.subscriptionId, 'PRE-1', 'subscriptionId foi trocado');
  eq(saved.previousPlan, 'monthly');
  const put = mpCalls.find((c) => c.method === 'PUT' && c.url.includes('/preapproval/PRE-1'));
  ok(put, 'não houve PUT na assinatura existente');
  eq(put.body.auto_recurring.transaction_amount, 19.9);
  eq(put.body.auto_recurring.currency_id, 'BRL');
  ok(!mpCalls.some((c) => c.method === 'POST' && c.url.endsWith('/preapproval')), 'criou segunda assinatura');
  ok(!put.body.frequency && !put.body.auto_recurring.frequency, 'tentou mudar a frequência');
});

await teste('upgrade bloqueia ciclo diferente, plano não básico e dispositivo errado', async () => {

    key: KEY, email: 'cliente@exemplo.com', plan, amount: plan === 'monthly' ? 9.9 : 19.9,
    status: 'active', subscriptionId: 'PRE-1', devices: [DEVICE], history: []
  });

    if (url.includes('/preapproval/PRE-1') && method === 'GET') {

  res = await post(globalThis.__mods['change-plan'].default, { key: KEY, deviceId: DEVICE, plan: 'monthly' });
  eq(res.status, 400, 'downgrade deveria ser bloqueado');
  eq(licenseMap.get(KEY).plan, 'intermediate_monthly', 'licença PRO foi alterada');

  reset({ license: license('monthly'), mpHandler: mp });
  res = await post(globalThis.__mods['change-plan'].default, { key: KEY, deviceId: 'DEV-BBBBBBBBBBBBBBBBBBBBBBBB', plan: 'intermediate_monthly' });
  eq(res.status, 403, 'outro aparelho deveria ser bloqueado');

await teste('troca de aparelho é self-service: chave + e-mail movem o vínculo', async () => {
  const licenseSrc = await origFetch(new URL('../netlify/functions/license.mjs', location.href)).then((r) => r.text());
  const app = await origFetch(new URL('../app.js', location.href)).then((r) => r.text());
  const readme = await origFetch(new URL('../README.md', location.href)).then((r) => r.text());
  ok(!/Para usar em outro dispositivo, fale com o administrador/.test(app), 'app ainda manda procurar o administrador');
  ok(!/Use o aparelho original ou fale com o administrador/.test(licenseSrc), 'servidor ainda manda procurar o administrador');
  includes(app, 'confirme o e-mail da assinatura', 'app não explica a troca sozinha');
  includes(app, 'O vínculo é transferido automaticamente', 'app não diz que a troca é automática');
  includes(readme, 'até o titular confirmar o e-mail da compra no aparelho novo', 'README não explica a troca');

  const NOVO = 'DEV-BBBBBBBBBBBBBBBBBBBBBBBB';
  const base = {
    key: KEY, email: 'cliente@exemplo.com', plan: 'monthly', amount: 9.9,
    status: 'active', subscriptionId: 'PRE-1', devices: [DEVICE],
    nextPaymentAt: new Date(Date.now() + 20 * 86400000).toISOString(), history: []
  };
  const L = globalThis.__mods['license'].default;

  reset({ license: { ...base } });
  let res = await post(L, { key: KEY, deviceId: NOVO });
  let data = await res.json();
  eq(data.state, 'device_mismatch', 'não avisou que a chave está em outro aparelho');
  includes(data.message, 'Digite o e-mail usado no checkout', 'mensagem não ensina como trocar');
  ok(!/fale com o administrador/i.test(data.message), 'mensagem ainda pede contato com o administrador');

  res = await post(L, { action: 'transfer', key: KEY, deviceId: NOVO, email: 'errado@exemplo.com' });
  eq(res.status, 403, 'e-mail errado deveria ser recusado');
  eq(licenseMap.get(KEY).devices[0], DEVICE, 'e-mail errado transferiu o vínculo');

  res = await post(L, { action: 'transfer', key: KEY, deviceId: NOVO, email: 'CLIENTE@EXEMPLO.COM' });
  data = await res.json();
  eq(res.status, 200, 'troca com e-mail correto falhou');
  eq(data.ok, true, 'resposta sem ok');
  eq(licenseMap.get(KEY).devices[0], NOVO, 'vínculo não foi movido');
  eq(licenseMap.get(KEY).devices.length, 1, 'ficou mais de um aparelho vinculado');
  ok(licenseMap.get(KEY).history.some((h) => h.event === 'transfer:device'), 'troca não entrou no histórico');

  res = await post(L, { key: KEY, deviceId: NOVO });
  data = await res.json();
  eq(data.valid, true, 'aparelho novo não ficou válido');
  eq(data.plan, 'monthly', 'plano mudou na troca');
  eq(data.subscriptionId, undefined, 'resposta pública expôs subscriptionId');

  res = await post(L, { key: KEY, deviceId: DEVICE });
  data = await res.json();
  eq(data.state, 'device_mismatch', 'aparelho antigo continua válido');
});

async function bloqueioConcorrente(fnName, path, corpo) {
  let liberar;
  const barreira = new Promise((resolve) => { liberar = resolve; });
  reset({
    mpHandler: async (url, init) => {
      if (String(init?.method || '').toUpperCase() === 'POST' && url.endsWith(path)) await barreira;
      return defaultMpHandler(url, init);
    }
  });
  const fn = globalThis.__mods[fnName].default;
  const primeiro = post(fn, corpo);
  for (let i = 0; i < 30 && lockMap.size === 0; i++) await new Promise((r) => setTimeout(r, 5));
  ok(lockMap.size > 0, 'o lock de cobrança não foi criado');
  const segundo = await post(fn, corpo);
  eq(segundo.status, 409, 'a segunda cobrança não foi bloqueada');
  liberar();
  await primeiro;
  eq(lockMap.size, 0, 'o lock não foi liberado ao terminar');
}

function pintar() {
  const report = document.getElementById('report');
  const total = suites.reduce((n, s) => n + s.testes.length, 0);
  const falhas = suites.reduce((n, s) => n + s.testes.filter((x) => !x.ok).length, 0);
  const resumo = document.getElementById('summary');
  resumo.textContent = falhas ? `${falhas} falha(s) de ${total} testes` : `Todos os ${total} testes passaram`;
  resumo.className = falhas ? 'fail' : 'ok';
  report.innerHTML = suites.map((s) => `
    <div class="grupo">${s.nome}</div>
    ${s.testes.map((t) => `<div class="teste ${t.ok ? 'ok' : 'fail'}"><span class="tag">${t.ok ? 'OK' : 'FALHA'}</span><span>${t.nome}${t.erro ? '<div class="detalhe">' + t.erro.replace(/</g, '&lt;') + '</div>' : ''}</span></div>`).join('')}
  `).join('');
}

/* A bateria roda durante a carga. O botão apenas recarrega para repetir. */
document.getElementById('run').addEventListener('click', () => location.reload());
pintar();
globalThis.fetch = origFetch;
})().catch((e) => {
  const resumo = document.getElementById('summary');
  if (resumo) {
    resumo.textContent = 'Erro ao preparar testes (' + (globalThis.__etapa || '?') + '): ' + (e && e.message ? e.message : String(e));
    resumo.className = 'fail';
  }
});
</script>
