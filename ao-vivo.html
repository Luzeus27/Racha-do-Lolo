<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#35d07f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Racha do Loló">
  <meta name="robots" content="noindex, nofollow">
  <title>Racha do Loló — Ao vivo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .view-wrap { max-width: 1080px; margin: 0 auto; padding: 18px 14px 60px; }
    .view-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .view-logo { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; color: #04180d; background: linear-gradient(135deg, var(--accent), var(--blue)); }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .pill.live { background: var(--red-soft); color: var(--red); }
    .score-line { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    .score-team { min-width: 0; }
    .score-team.right { text-align: right; }
    .team-tag { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 900; font-size: 12px; margin-bottom: 8px; }
    .team-tag.b { background: var(--blue-soft); color: var(--blue); }
    .score-nums { display: flex; align-items: center; gap: 10px; font-size: 52px; font-weight: 900; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1; }
    .score-nums .x { font-size: 20px; color: var(--muted); font-weight: 700; }
    .list-row { padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
    .list-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .team-box { border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); padding: 12px; }
    .team-box h4 { margin: 0 0 8px; font-size: 13px; }
    .team-box ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .team-box li { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 640px) { .score-nums { font-size: 40px; } .score-line { gap: 6px; } }
  </style>
</head>
<body>
  <div class="view-wrap">
    <header class="view-head">
      <div class="view-logo">RL</div>
      <div style="flex:1;min-width:0">
        <h1>Racha do Loló — Ao vivo</h1>
        <p class="tiny muted" id="live-status" aria-live="polite">Carregando…</p>
      </div>
      <span class="pill">Atualização automática</span>
    </header>

    <main id="live-root" class="stack">
      <div class="card"><div class="card-body empty">Carregando…</div></div>
    </main>

    <p class="tiny muted center" style="margin-top:22px">Acompanhamento somente leitura · atualizado automaticamente.</p>
  </div>
  <script src="./ao-vivo.js" defer></script>
</body>
</html>
