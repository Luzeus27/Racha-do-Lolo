<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#35d07f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Racha do Loló" />
  <meta name="description" content="Gestão completa do Racha do Loló: caixa, jogadores, mensalidades, jogos e ranking." />
  <title>Racha do Loló — Gestão do Racha</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">RL</div>
        <div class="brand-text">
          <strong>Racha do Loló</strong>
          <span>Gestão do racha</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" data-act="theme" type="button"><span id="theme-icon">☀️</span> <span id="theme-label">Tema claro</span></button>
        <div class="version">v1.0 · dados salvos neste navegador</div>
      </div>
    </aside>

    <div class="main-wrap">
      <div id="license-banner" class="license-banner" hidden></div>
      <header class="topbar">
        <button class="icon-btn mobile-menu" data-act="toggle-sidebar" type="button" aria-label="Abrir menu">☰</button>
        <div class="topbar-title">
          <h1 id="page-title">Visão geral</h1>
          <p id="page-subtitle">Acompanhe o caixa e o desempenho do racha</p>
        </div>
        <div class="topbar-actions">
          <label class="select-wrap compact">
            <span>Ano</span>
            <select id="year-select" aria-label="Ano de controle"></select>
          </label>
          <button class="btn btn-ghost" data-act="export-json" type="button" title="Baixar backup">⬇ Backup</button>
          <button class="btn btn-primary" data-act="open-modal" data-modal="quick-add" type="button">＋ Novo</button>
        </div>
      </header>

      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="subscription.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
