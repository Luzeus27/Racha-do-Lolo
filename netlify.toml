[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Lembretes 24h/2h antes dos jogos (agendado; REMINDER_SECRET é opcional).
[functions."send-reminders"]
  schedule = "0 12 * * *"
